<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">The economic trust stack: what each layer does, and what it depends on</title>
  <desc id="stackDesc">Seven horizontal bands forming a ladder. From the base upward: identifiers, which name the object; data and credential models, which express a claim; traceability and exchange protocols, which move records along a supply chain; conformity assessment and certification, which test, inspect and certify; accreditation, which establishes that verifiers are competent; governance and mutual recognition, the arrangements by which one system accepts another; and mandating regulation, the law that compels verification. Each layer depends on those beneath it. Shading indicates position in the ladder.</desc>
  <rect width="760" height="496" fill="#FAF8F3"/>
  <g>
    <rect x="118" y="28.0" width="602" height="46" fill="#004040"/>
    <text x="104" y="55.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">07</text>
    <text x="136" y="49.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF8F3">Mandating regulation</text>
    <text x="136" y="66.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FAF8F3">Law that compels verification</text>
  </g>
  <g>
    <rect x="118" y="76.0" width="602" height="46" fill="#3E726C"/>
    <text x="104" y="103.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">06</text>
    <text x="136" y="97.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF8F3">Governance and mutual recognition</text>
    <text x="136" y="114.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FAF8F3">Arrangements by which one system accepts another</text>
  </g>
  <g>
    <rect x="118" y="124.0" width="602" height="46" fill="#6E9691"/>
    <text x="104" y="151.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">05</text>
    <text x="136" y="145.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Accreditation</text>
    <text x="136" y="162.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Establishing that verifiers are competent</text>
  </g>
  <g>
    <rect x="118" y="172.0" width="602" height="46" fill="#9BB6B2"/>
    <text x="104" y="199.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">04</text>
    <text x="136" y="193.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Conformity assessment and certification</text>
    <text x="136" y="210.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Testing, inspection, and certification</text>
  </g>
  <g>
    <rect x="118" y="220.0" width="602" height="46" fill="#C2D2CF"/>
    <text x="104" y="247.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">03</text>
    <text x="136" y="241.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Traceability and exchange protocols</text>
    <text x="136" y="258.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Moving records along a supply chain</text>
  </g>
  <g>
    <rect x="118" y="268.0" width="602" height="46" fill="#E8EEED"/>
    <text x="104" y="295.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">02</text>
    <text x="136" y="289.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Data and credential models</text>
    <text x="136" y="306.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">How a claim is expressed</text>
  </g>
  <g>
    <rect x="118" y="316.0" width="602" height="46" fill="#F2F0EA"/>
    <text x="104" y="343.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">01</text>
    <text x="136" y="337.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Identifiers</text>
    <text x="136" y="354.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Naming the object</text>
