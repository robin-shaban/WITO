    <text x="136" y="241.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Traçabilité et protocoles d’échange</text>
    <text x="136" y="258.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Faire circuler les enregistrements le long d’une chaîne</text>
  </g>
