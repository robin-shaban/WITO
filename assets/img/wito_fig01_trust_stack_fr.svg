    <text x="136" y="97.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF8F3">Gouvernance et reconnaissance mutuelle</text>
    <text x="136" y="114.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FAF8F3">Les arrangements par lesquels un système en accepte un autre</text>
  </g>
  <g>
