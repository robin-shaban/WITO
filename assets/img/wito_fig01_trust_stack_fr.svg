    <text x="136" y="193.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2322">Évaluation de la conformité et certification</text>
    <text x="136" y="210.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Essais, inspection et certification</text>
  </g>
  <g>
    <rect x="118" y="220.0" width="602" height="46" fill="#C2D2CF"/>
