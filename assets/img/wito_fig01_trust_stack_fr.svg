<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">La pile de confiance économique : ce que fait chaque couche et ce dont elle dépend</title>
  <desc id="stackDesc">Sept bandes horizontales formant une échelle. De la base vers le sommet : les identifiants, qui nomment l’objet ; les modèles de données et d’attestations, qui expriment une affirmation ; la traçabilité et les protocoles d’échange, qui font circuler les enregistrements le long d’une chaîne d’approvisionnement ; l’évaluation de la conformité et la certification, qui procèdent aux essais, à l’inspection et à la certification ; l’accréditation, qui établit la compétence des vérificateurs ; la gouvernance et la reconnaissance mutuelle, les arrangements par lesquels un système en accepte un autre ; et la réglementation prescriptive, la loi qui impose la vérification. Chaque couche s’appuie sur celles qui la précèdent. La teinte indique la position dans l’échelle.</desc>
  <rect width="760" height="496" fill="#FAF8F3"/>
  <g>
    <rect x="118" y="28.0" width="602" height="46" fill="#004040"/>
    <text x="104" y="55.0" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#4A5552" letter-spacing="0.06em">07</text>
    <text x="136" y="49.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF8F3">Réglementation prescriptive</text>
    <text x="136" y="66.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#FAF8F3">La loi qui impose la vérification</text>
  </g>
  <g>
