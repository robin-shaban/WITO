    <text x="136" y="162.0" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#1F2322">Établir la compétence des vérificateurs</text>
  </g>
  <g>
    <rect x="118" y="172.0" width="602" height="46" fill="#9BB6B2"/>
